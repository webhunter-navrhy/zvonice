<article class="kc">{% if b.foto %}{{ img(b.foto, b.nadpis, sizes='(min-width: 900px) 32vw, 100vw') }}{% endif %}<div class="kc-in">{% if b.stitek %}<small>{{ b.stitek }}</small>{% endif %}<h3>{{ b.nadpis }}</h3>{% if b.cena %}<p class="cena"><b>{{ b.cena }}</b></p>{% endif %}{% if b.text %}<p>{{ b.text | replace('\n', ' ') }}</p>{% endif %}<a class="odkaz" href="{{ url('poptavka/') }}?balicek={{ b.nadpis | urlencode }}#formular">Poptat balíček</a></div></article>
